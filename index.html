<!DOCTYPE html>
<html lang="en" data-notes="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguyễn Thùy Ngân · KOL Marketing Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Portfolio of Nguyễn Thùy Ngân, KOL Marketing at Garena Vietnam.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141414'/%3E%3Ctext x='32' y='43' font-size='28' font-family='Impact,Arial' text-anchor='middle' fill='%23fff'%3ETN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Allura&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EF;--paper:#FFFDF9;--ink:#141414;--blue:#3C6FE0;--blue-l:#DCE7FF;--pink:#F8A8C9;--orange:#FFA46B;--sky:#A9C6F5;--lime:#C7F36A;--mute:#5a5a5a;--sand:#ECE6D9;
  --head:'Anton',Impact,'Arial Narrow',sans-serif;--script:'Allura','Brush Script MT',cursive;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%;overflow-x:hidden}
html,body{margin:0}
body{background:linear-gradient(180deg,#E9E1D2 0%,#E1D8C7 42%,#D6D9DE 100%);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{font-weight:400}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sc{font-family:var(--script);line-height:.9}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
mark{background:linear-gradient(transparent 55%,var(--lime) 55%);color:inherit;padding:0 .05em}
.card{background:var(--paper);border-radius:22px;box-shadow:0 14px 34px -18px rgba(20,20,20,.35),0 0 0 1px rgba(20,20,20,.07);position:relative}
.cyc>*:nth-child(4n+1){--ac:var(--pink)}.cyc>*:nth-child(4n+2){--ac:var(--orange)}.cyc>*:nth-child(4n+3){--ac:var(--sky)}.cyc>*:nth-child(4n+4){--ac:var(--lime)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--pink);font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 22px;border-radius:999px;border:2px solid var(--ink);background:transparent;text-decoration:none;font:700 .9rem var(--body);transition:transform .2s,background .2s}
.bt:hover{transform:translateY(-2px)}.bt.dk{background:var(--ink);color:#fff}
.ico{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}.ico .i{width:18px;height:18px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.smp{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#fff3b0;border:1.5px dashed #b39b00;font:700 .58rem var(--body);letter-spacing:.1em;vertical-align:middle;color:#6b5d00}
html[data-notes="off"] .smp{display:none}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(229,220,204,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(20,20,20,.16)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:64px}
.nav b{font:400 1.15rem var(--head);letter-spacing:.04em;text-transform:uppercase;margin-right:auto;white-space:nowrap}
.nav nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.nav nav::-webkit-scrollbar{display:none}
.nav nav a{padding:10px 12px;border-radius:999px;text-decoration:none;font:700 .76rem var(--body);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav nav a:nth-child(4n+1):hover{background:var(--pink)}.nav nav a:nth-child(4n+2):hover{background:var(--orange)}.nav nav a:nth-child(4n+3):hover{background:var(--sky)}.nav nav a:nth-child(4n+4):hover{background:var(--lime)}
@media (max-width:760px){.nav .wrap{height:auto;padding:8px 0;flex-wrap:wrap;gap:2px}.nav b{width:100%}}

/* media slots */
.slot{position:relative;overflow:hidden;background:var(--sand);border-radius:14px;width:100%}
.slot .media{width:100%;height:100%;object-fit:cover;display:block}
.slot.ready{cursor:zoom-in;background:transparent}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;text-align:center;border:1.5px dashed rgba(20,20,20,.4);border-radius:14px}
.ph .i{width:24px;height:24px;opacity:.6;stroke-width:1.5}
.ph-t{font:700 .6rem var(--body);letter-spacing:.1em}
.ph-n{font:400 .7rem/1.3 var(--body);max-width:30ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph code{font:500 .58rem ui-monospace,Menlo,monospace;opacity:.75;word-break:break-all}
html[data-notes="off"] .slot.empty{display:none}
.slot .lnk{position:absolute;right:8px;top:8px;z-index:3;padding:5px 10px;border-radius:999px;background:var(--ink);color:#fff;font:600 .66rem var(--body);text-decoration:none}
.cap{font-size:.78rem;color:var(--mute);padding:6px 2px 0}
#lb{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.88);display:none;align-items:center;justify-content:center;padding:24px}
#lb.open{display:flex}#lb img,#lb video{max-width:100%;max-height:100%;border-radius:10px}
#lb .x{position:absolute;right:18px;top:18px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:22px;padding:clamp(22px,4vw,46px);margin-top:22px;overflow:hidden}
.hero .l{align-self:center}
.hero .sc{font-size:clamp(3.4rem,7.4vw,6rem);transform:rotate(-6deg);transform-origin:left bottom;margin:0 0 .02em .02em;padding-top:.1em;position:relative;z-index:2}
.hero h1{font:400 clamp(3.2rem,8.6vw,7.6rem)/.88 var(--head);text-transform:uppercase}
.hero p{max-width:36ch;font-size:1.05rem;color:#2a2a2a;margin:clamp(18px,3vw,30px) 0 14px}
.hero .sub{font-size:.92rem;color:var(--mute);margin:0 0 22px}
.lets{position:relative;display:inline-block;padding:14px 38px;border:1.5px solid var(--blue);background:var(--blue-l);font:700 1.05rem var(--body);letter-spacing:.14em;text-decoration:none;text-transform:uppercase}
.lets i{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--blue)}.lets i:nth-child(1){left:-6px;top:-6px}.lets i:nth-child(2){right:-6px;bottom:-6px}
.soc{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.soc a{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);text-decoration:none}
.soc a.off{border-style:dashed;opacity:.5}
html[data-notes="off"] .soc a.off{display:none}
.soc .i{width:20px;height:20px}
.hero .r{position:relative;min-height:440px;min-width:0}
.hero .sq{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:min(56%,330px);aspect-ratio:1;background:var(--sky);border-radius:6px}
.hero .cut{position:absolute;left:0;right:0;bottom:0;top:-10%}
.hero .cut .slot{height:100%;background:transparent}.hero .cut .media{object-fit:contain;object-position:bottom;filter:drop-shadow(0 14px 14px rgba(0,0,0,.18))}
.fold{position:absolute;display:block;width:clamp(74px,11vw,112px);text-decoration:none;z-index:3;transition:transform .25s}
.fold:hover{transform:translateY(-6px) rotate(-3deg)}.fold svg{width:100%;height:auto;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.fold span{display:block;text-align:center;font:600 clamp(.5rem,.85vw,.62rem) ui-monospace,Menlo,monospace;margin-top:2px;white-space:nowrap}
.fold.a{left:0;top:2%}.fold.b{right:0;top:2%}.fold.c{left:0;bottom:12%}.fold.d{right:0;bottom:12%}
.who{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:400 1.1rem var(--head);letter-spacing:.06em;text-transform:uppercase;z-index:4}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.hero .r{min-height:340px;margin-top:14px}}

/* hero photo: a normal (non-cutout) photo is shown as a framed picture */
.hero .sq:has(.slot.ext-jpg),.hero .sq:has(.slot.ext-jpeg),.hero .sq:has(.slot.ext-webp){width:min(64%,350px);aspect-ratio:4/5;border:3px solid var(--ink);border-radius:12px;box-shadow:9px 9px 0 var(--pink);transform:translate(-50%,-54%) rotate(2deg);overflow:hidden}
.hero .sq:has(.slot.ext-jpg) .cut,.hero .sq:has(.slot.ext-jpeg) .cut,.hero .sq:has(.slot.ext-webp) .cut{top:0}
.hero .sq:has(.slot.ext-jpg) .cut .media,.hero .sq:has(.slot.ext-jpeg) .cut .media,.hero .sq:has(.slot.ext-webp) .cut .media{object-fit:cover;object-position:50% 28%;filter:none}

/* stats + marquee */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.stat{padding:18px 18px 16px;border-radius:18px;background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ac,var(--ink))}
.stat .ico{margin-bottom:10px}.stat b{display:block;font:400 clamp(2rem,4vw,2.8rem)/1 var(--head)}.stat .lb{display:block;font-size:.85rem;color:var(--mute);margin-top:4px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.marq{margin-top:22px;overflow:hidden;border-block:2px solid var(--ink);background:var(--ink);color:#fff;padding:12px 0}
.marq .tr{display:flex;width:max-content;animation:mq 32s linear infinite}
.marq .grp{display:flex;gap:12px;padding-right:12px}
.marq span{padding:6px 18px;border-radius:999px;background:var(--ac);color:var(--ink);font:700 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq .tr{animation:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* sections */
.sec{margin-top:clamp(54px,8vw,96px)}
.sec>h2,.sec h3.h2l{display:block;text-align:center;text-transform:uppercase;margin-bottom:22px}
.sec>h2{font:400 clamp(2.4rem,6vw,4.6rem)/1.02 var(--head)}
.sec h3.h2l{font:400 clamp(1.9rem,4.4vw,3rem)/1.02 var(--head);margin-bottom:12px}
.sec>h2 .sc,.sec h3.h2l .sc{display:block;font-size:.55em;line-height:1.25;text-transform:none;margin:0 0 .12em;padding-top:.1em;color:var(--ink)}
.sec>h2::after,.sec h3.h2l::after{content:"";display:block;width:132px;height:9px;margin:16px auto 0;border-radius:99px;background:linear-gradient(90deg,var(--pink) 0 25%,var(--orange) 25% 50%,var(--sky) 50% 75%,var(--lime) 75% 100%)}
.sec h3.h2l::after{width:110px;height:8px;margin-top:12px}
.lead{max-width:56ch;color:var(--mute);margin:-6px auto 20px;text-align:center}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(16px,3vw,32px);padding:clamp(18px,3vw,32px);align-items:center;margin-top:22px}
.win{border-radius:12px;overflow:hidden;border:2px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink)}
.win .bar{height:26px;background:#2a2a2a;display:flex;align-items:center;gap:6px;padding:0 10px}
.win .bar i{width:9px;height:9px;border-radius:50%;background:#EE3F12}.win .bar i:nth-child(2){background:#F9C70F}.win .bar i:nth-child(3){background:#12B76A}
.win .slot{border-radius:0}
@media (max-width:860px){.about{grid-template-columns:minmax(0,1fr)}}

/* about: browser window */
.about{align-items:center}
.bwrap{position:relative;padding:22px 18px 26px;border-radius:22px;background-image:radial-gradient(circle,rgba(20,20,20,.16) 1.4px,transparent 1.7px);background-size:17px 17px}
.bw{position:relative;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:8px 8px 0 var(--pink);outline:1.5px solid var(--blue);outline-offset:7px}
.bw .hdl{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--blue);border-radius:2px;z-index:4}
.bw .hdl.a{left:-14px;top:-14px}.bw .hdl.b{right:-14px;top:-14px}.bw .hdl.c{left:-14px;bottom:-14px}.bw .hdl.d{right:-14px;bottom:-14px}
.bw-top{display:flex;align-items:flex-end;gap:12px;padding:10px 14px 0;background:var(--sky);border-radius:12px 12px 0 0;border-bottom:2px solid var(--ink)}
.bw-top .dots{display:flex;gap:6px;align-self:center;padding-bottom:6px}
.bw-top .dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);background:#EE3F12}.bw-top .dots i:nth-child(2){background:#F9C70F}.bw-top .dots i:nth-child(3){background:#12B76A}
.bw-top .btab{display:inline-flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;padding:6px 14px;font:700 .72rem ui-monospace,Menlo,Consolas,monospace;margin-bottom:-2px}
.bw-top .btab b{font:700 .9rem var(--body)}
.bw-top .plus{align-self:center;padding-bottom:6px;font:700 1.1rem var(--body)}
.bw-bar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:2px solid var(--ink);background:#F6F2E8}
.bw-bar .nb{display:inline-flex;gap:8px;font-size:1.05rem;flex:none}.bw-bar .nb>span{display:inline-flex}
.bw-bar .addr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font:600 .74rem ui-monospace,Menlo,Consolas,monospace}
.bw-bar .addr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bw-bar .addr .i{width:14px;height:14px;flex:none}
.bw-body{padding:clamp(18px,3vw,30px) clamp(18px,3vw,32px) 22px}
.bw-body .sc{display:block;font-size:clamp(2.6rem,4.6vw,3.6rem);color:var(--blue);margin:0 0 2px;line-height:1.1}
.bw-body .sqg{width:min(240px,60%);height:12px;margin:0 0 14px 4px}
.bw-body p{margin:0 0 10px;font-size:.98rem;line-height:1.6;max-width:62ch}.bw-body p.strong{font-weight:700;font-size:1.05rem}
.bw-body mark{background:linear-gradient(transparent 52%,var(--lime) 52%);padding:0 .1em}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bchips>span{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border:2px solid var(--ink);border-radius:999px;background:var(--ac,var(--pink));font:700 .74rem var(--body)}
.bchips .i{width:14px;height:14px}.bchips img{height:16px;width:auto;max-width:58px;object-fit:contain}
.bw-st{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:0 0 11px 11px;font:600 .72rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.bw-st .live{width:9px;height:9px;border-radius:50%;background:#2FD66B;box-shadow:0 0 0 3px rgba(47,214,107,.3);animation:pulse 1.8s ease-in-out infinite;flex:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(47,214,107,0)}}
.bwrap .spk{position:absolute;width:26px;height:26px;color:var(--ink);z-index:5}
.bwrap .spk.s1{left:-6px;top:56px;color:var(--orange);width:30px;height:30px}.bwrap .spk.s2{right:-4px;top:150px;width:20px;height:20px}.bwrap .spk.s3{left:30%;bottom:-6px;color:var(--sky);width:28px;height:28px}
.bwrap .stick{position:absolute;right:-6px;top:-8px;z-index:6;transform:rotate(11deg);width:84px;height:84px;border-radius:50%;background:var(--lime);border:2px solid var(--ink);display:grid;place-items:center;text-align:center;font:700 .74rem/1.15 var(--body);letter-spacing:.04em;text-transform:uppercase}
.bwrap .curs{position:absolute;right:18px;bottom:-12px;width:34px;height:34px;z-index:6}
@media (max-width:620px){.bw-bar .nb:last-child{display:none}.bwrap .stick{width:68px;height:68px;font-size:.62rem;right:-2px}.bwrap{padding:18px 12px 22px}.bw-top .btab{padding:5px 10px}}
@media (prefers-reduced-motion:reduce){.bw-st .live{animation:none}}
/* tool tiles */
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px;margin-top:18px}
.tg>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 6px;border:2px solid var(--ink);border-radius:16px;background:var(--ac,#fff);font:700 .74rem var(--body);text-align:center;box-shadow:4px 4px 0 var(--ink)}
.tg img,.tg em{width:40px;height:40px;object-fit:contain;border-radius:10px;background:#fff;padding:4px}
.tg em{display:grid;place-items:center;background:var(--ink);color:#fff;font:700 .85rem var(--body);font-style:normal}

/* education notebook */
.nbk{display:grid;grid-template-columns:minmax(0,1.04fr) 34px minmax(0,1.1fr);border-radius:26px;overflow:hidden;box-shadow:0 24px 50px -26px rgba(20,20,20,.6);border:2px solid var(--ink);margin-top:22px}
.pgL{position:relative;background:#171717 repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px);color:#F5F1E8;padding:clamp(22px,3.4vw,40px);overflow:hidden;display:flex;flex-direction:column}
.edh{position:relative;font:400 clamp(2.4rem,4.6vw,3.6rem)/1 var(--head);text-transform:uppercase;letter-spacing:.02em;color:#F5F1E8;margin:2px 0 clamp(20px,3.2vw,32px)}
.edh::after{content:"";display:block;width:96px;height:8px;margin-top:12px;border-radius:99px;background:linear-gradient(90deg,var(--pink) 0 25%,var(--orange) 25% 50%,var(--sky) 50% 75%,var(--lime) 75% 100%)}
.sch{margin-bottom:clamp(16px,2.4vw,24px)}
.sch .sh{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap}
.sch h3{font:700 clamp(1.05rem,1.8vw,1.35rem)/1.25 var(--body);color:#fff;flex:1 1 0;min-width:0}
.sch .lg{width:76px;flex:none}
.sch .lg .slot{aspect-ratio:1!important;border-radius:50%;background:rgba(255,255,255,.1)}
.sch .lg .ph{padding:2px;border-radius:50%;border-color:rgba(255,255,255,.45);color:#fff}
.sch .lg .ph-n,.sch .lg .ph code,.sch .lg .ph-t{display:none}
.sch .lg .slot.ready{background:#fff}.sch .lg .media{object-fit:contain;border-radius:50%;padding:3px}
.sch .dg{margin:8px 0 6px;font-size:clamp(1.05rem,1.7vw,1.3rem);line-height:1.35}
.sch .dg em{color:var(--lime);font-style:italic}
.sch ul{margin:0;padding-left:1.1em;display:grid;gap:3px;font-size:.98rem;color:#E7E2D6}
.seals{position:relative;width:calc(100% + 28px);margin-inline:-14px;align-self:stretch;margin-top:auto;padding-top:clamp(34px,4.6vw,56px);display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(6px,1.2vw,16px);align-items:start;justify-items:center}
.seal{position:relative;width:100%;max-width:220px;aspect-ratio:1;container-type:inline-size}
.seal svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(var(--r,0deg));filter:drop-shadow(0 10px 12px rgba(0,0,0,.55))}
.seal .st{position:absolute;inset:19% 14%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#141414;gap:3cqw}
.seal .st small{font:700 max(9.5px,5.4cqw)/1.25 var(--body);letter-spacing:.12em;text-transform:uppercase}
.seal .st b{font:400 24cqw/.95 var(--head);text-transform:uppercase;letter-spacing:.02em}
.seal .st span{font:600 max(9.5px,5.6cqw)/1.25 var(--body)}
.seals .scribble{position:absolute;left:2px;top:-8px;width:50px;height:50px;transform:rotate(-12deg);opacity:.9}
.spine{background:linear-gradient(90deg,#0c0c0c,#262626 40%,#0c0c0c);position:relative}
.spine::before{content:"";position:absolute;inset:6px 4px;background:repeating-linear-gradient(180deg,transparent 0 8px,#F2EEE4 8px 20px,transparent 20px 34px);border-radius:6px;opacity:.9}

 '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+(S.cv?'<a class="bt" style="background:#fff;border-color:#fff" href="'+esc(S.cv)+'" download>'+I("download")+'Download CV</a>':'<a class="bt off" style="border-color:#fff;border-style:dashed;opacity:.55" href="#contact" title="Set SITE.cv to show a Download CV button" data-opt>'+I("download")+'Download CV</a>')+'</div></section>'+

(function(){var b=$("a[data-opt]");if(b){var st=document.createElement("style");st.textContent='html[data-notes="off"] a[data-opt]{display:none}';document.head.appendChild(st)}})();

/* tool icons: built-in platform mark, else embedded logo, else assets/brands/<key>.(png|webp|svg), else letters */
$$(".tic").forEach(function(el){
  var k=el.dataset.k,txt=el.dataset.t;
  if(BRAND_SVG[k]){el.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+BRAND_SVG[k].d+'" fill="'+BRAND_SVG[k].c+'"/></svg>';return}
  var srcs=[];if(BRAND_IMG[k])srcs.push(BRAND_IMG[k]);["png","webp","svg"].forEach(function(e){srcs.push("assets/brands/"+k+"."+e)});
  var n=0,im=new Image();im.alt="";
  im.onload=function(){el.innerHTML="";el.appendChild(im)};
  im.onerror=function(){if(n<srcs.length){im.src=srcs[n++]}else{el.innerHTML="<em>"+esc(txt)+"</em>"}};
  im.onerror();
});

(function(){var G={about:"About",edu:"Study",exp:"Record",work:"Work",personal:"Project",extra:"Beyond",testi:"Voices"};Object.keys(G).forEach(function(k){var e=document.getElementById(k);if(e)e.setAttribute("data-ghost",G[k])})})();

   SL(p.hero)+
   '<div class="chips cyc" style="margin-top:22px">'+p.chips.map(function(c){return '<span>'+esc(c)+'</span>'}).join("")+'</div>'+

function showCase(i){
  cur=i;$$(".tab",ctabs).forEach(function(b,j){b.setAttribute("aria-selected",j===i?"true":"false")});
  var p=S.projects[i];card.innerHTML=csHTML(p);card.style.setProperty("--ac","var(--pink)");
  mountSlots(card);watch(card);reveal(card);$$(".rv",card).forEach(function(el){el.classList.add("in")});
}
S.projects.forEach(function(p,i){var b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.textContent=p.short;b.addEventListener("click",function(){showCase(i)});ctabs.appendChild(b)});
showCase(0);

(function(){var t=$("#rtr");function go(d){t.scrollBy({left:d*(t.clientWidth*.7),behavior:"smooth"})}$("#rl").addEventListener("click",function(){go(-1)});$("#rr").addEventListener("click",function(){go(1)})})();

(function(){
  var items=S.creative.items,tabs=["All"].concat(items.map(function(x){return x.tab}).filter(function(v,i,a){return a.indexOf(v)===i})),g=$("#cgrid"),gt=$("#gtabs");
